
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CateSys - Cadastrar Catequista</title>

    <link rel="stylesheet" href="/catequistas.css">
    <script src="/catequistas.js" defer></script>
</head>

<body data-pagina="cadastro">

<header>
    <h1>CateSys</h1>
    <p>Paróquia São Francisco Xavier</p>
</header>

<main>
    <nav class="navegacao">
        <a href="/catequistas.html">Início</a>
        <span>/</span>
        <span id="caminhoAtual">Cadastrar Catequista</span>
    </nav>

    <section class="painel">
        <h2 id="tituloFormulario">
            Cadastrar Catequista
        </h2>

        <p>Preencha os dados do catequista.</p>

        <form id="formCatequista" novalidate>
            <input type="hidden" id="catequistaId">

            <div class="campos">

                <div class="campo">
                    <label for="nome">Nome *</label>

                    <input
                            type="text"
                            id="nome"
                            maxlength="150"
                            placeholder="Nome completo"
                            required
                    >
                </div>

                <div class="campo">
                    <label for="cpf">CPF *</label>

                    <input
                            type="text"
                            id="cpf"
                            maxlength="14"
                            inputmode="numeric"
                            placeholder="000.000.000-00"
                            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                            required
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>

                    <input
                            type="tel"
                            id="telefone"
                            maxlength="15"
                            inputmode="numeric"
                            placeholder="(00) 00000-0000"
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                            type="email"
                            id="email"
                            maxlength="150"
                            placeholder="email@exemplo.com"
                    >
                </div>

                <div class="campo">
                    <label for="dataInicio">
                        Data de início
                    </label>

                    <input
                            type="date"
                            id="dataInicio"
                    >
                </div>

                <div class="campo">
                    <label for="dataFim">
                        Data de término
                    </label>

                    <input
                            type="date"
                            id="dataFim"
                    >
                </div>

                <div class="campo">
                    <label for="secretariaId">
                        ID da Secretaria
                    </label>

                    <input
                            type="number"
                            id="secretariaId"
                            min="1"
                            step="1"
                            placeholder="Opcional"
                    >
                </div>

            </div>

            <div class="botoes">
                <button type="submit" id="btnSalvar">
                    Cadastrar
                </button>

                <button type="button" id="btnLimpar">
                    Limpar
                </button>

                <a class="botao-link"
                   href="/catequistas.html">
                    Voltar
                </a>
            </div>
        </form>

        <p id="mensagem"
           role="status"
           aria-live="polite">
        </p>
    </section>
</main>

<footer>
    <p>CateSys - Gerenciamento da Catequese</p>
</footer>

</body>
</html>
