<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CateSys | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link href="/css/style.css" rel="stylesheet">
</head>

<body>

<section class="login-screen">

    <div class="login-brand">
        <div class="text-center">

            <div class="brand-symbol">
                <i class="bi bi-book-half"></i>
                <span class="brand-cross">+</span>
            </div>

            <div class="brand-name">
                Cate<span>Sys</span>
            </div>

            <p class="brand-tagline">
                Sistema de Gerenciamento Catequético
            </p>

        </div>
    </div>

    <div class="login-panel">

        <!-- LOGIN -->
        <form class="login-card" id="formLogin" novalidate>

            <h1>LOGIN</h1>

            <p class="login-subtitle">
                Acesse sua área de trabalho
            </p>

            <label class="form-label" for="loginUser">
                CPF ou e-mail
            </label>

            <input class="form-control login-input" id="loginUser" type="text" required
                   autocomplete="username" placeholder="Digite seu CPF ou e-mail">

            <label class="form-label mt-3" for="loginPassword">
                Senha
            </label>

            <input class="form-control login-input" id="loginPassword" type="password" required
                   autocomplete="current-password" placeholder="Digite sua senha">

            <button type="submit" id="btnEntrar" class="btn btn-primary w-100 login-submit mt-4">
                Entrar
            </button>

            <div id="mensagemLogin" class="alert d-none mt-3 mb-0" role="alert"></div>
        </form>

        <!-- PRIMEIRO ACESSO: só aparece enquanto o sistema não tem nenhum usuário -->
        <form class="login-card d-none" id="formPrimeiroAcesso" novalidate>

            <h1>PRIMEIRO ACESSO</h1>

            <p class="login-subtitle">
                Cadastre o usuário administrador inicial
            </p>

            <label class="form-label" for="paNome">Nome</label>
            <input class="form-control login-input" id="paNome" type="text" required autocomplete="name">

            <label class="form-label mt-3" for="paCpf">CPF</label>
            <input class="form-control login-input" id="paCpf" type="text" required inputmode="numeric"
                   maxlength="14" placeholder="000.000.000-00">

            <label class="form-label mt-3" for="paEmail">E-mail</label>
            <input class="form-control login-input" id="paEmail" type="email" required autocomplete="email">

            <label class="form-label mt-3" for="paSenha">Senha</label>
            <input class="form-control login-input" id="paSenha" type="password" required minlength="6"
                   autocomplete="new-password" placeholder="Mínimo de 6 caracteres">

            <button type="submit" id="btnPrimeiroAcesso" class="btn btn-primary w-100 login-submit mt-4">
                Cadastrar e entrar
            </button>

            <div id="mensagemPrimeiroAcesso" class="alert d-none mt-3 mb-0" role="alert"></div>
        </form>
    </div>

</section>

<script src="/js/login.js"></script>
</body>
</html>
