<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CateSys | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link href="/css/style.css" rel="stylesheet">
</head>

<body>

<section class="login-screen">

    <div class="login-brand">
        <div class="text-center">

            <div class="brand-symbol">
                <i class="bi bi-book-half"></i>
                <span class="brand-cross">+</span>
            </div>

            <div class="brand-name">
                Cate<span>Sys</span>
            </div>

            <p class="brand-tagline">
                Sistema de Gerenciamento Catequético
            </p>

        </div>
    </div>

    <div class="login-panel">

        <div class="login-card">

            <h1>LOGIN</h1>

            <p class="login-subtitle">
                Acesse sua área de trabalho
            </p>

            <label class="form-label" for="loginUser">
                CPF ou e-mail
            </label>

            <input
                    class="form-control login-input"
                    id="loginUser"
                    type="text"
                    autocomplete="username"
                    placeholder="Digite seu CPF ou e-mail"
            >

            <label class="form-label mt-3" for="loginPassword">
                Senha
            </label>

            <input
                    class="form-control login-input"
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
            >

            <div class="mt-3">
                <a href="#" class="small-link">
                    Esqueci a senha
                </a>
            </div>

            <a
                    href="/html/dashboard.html"
                    class="btn btn-primary w-100 login-submit mt-4"
            >
                Entrar
            </a>

            <p class="text-center text-muted small mt-3 mb-0">
                Login demonstrativo, sem autenticação.
            </p>

        </div>
    </div>

</section>

</body>
</html>
