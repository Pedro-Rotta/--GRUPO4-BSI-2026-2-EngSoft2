
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CateSys | Consultar Catequistas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/catequistas-paginas.css">

    <script src="/js/menu.js" defer></script>
    <script src="/js/catequistas.js" defer></script>
</head>

<body data-pagina="consulta">

<div class="app-shell">

    <!-- MENU LATERAL -->

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-area">

        <!-- CABECALHO -->

        <header class="topbar">

            <button
                type="button"
                class="btn-menu"
                id="menuToggle"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="sidebar">
                <i class="bi bi-list"></i>
            </button>

            <div class="breadcrumb-area">

                <a href="/html/dashboard.html"
                   class="text-decoration-none">
                    CateSys
                </a>

                <i class="bi bi-chevron-right"></i>

                <a href="/html/catequistas.html"
                   class="text-decoration-none">
                    Catequistas
                </a>

                <i class="bi bi-chevron-right"></i>

                <strong>Consultar Catequistas</strong>

            </div>

            <div class="d-flex align-items-center gap-3">
                <span class="today-date"></span>
                <div class="top-avatar">CS</div>
            </div>

        </header>

        <!-- CONTEUDO -->

        <div class="page-content">

            <div class="page-heading">

                <div>
                    <h1>Consultar Catequistas</h1>
                    <p>
                        Pesquise, edite ou exclua
                        catequistas cadastrados.
                    </p>
                </div>

                <div class="d-flex flex-wrap gap-2">

                    <a href="/html/cadastrar-catequista.html"
                       class="btn btn-primary">
                        <i class="bi bi-person-plus me-1"></i>
                        Novo Catequista
                    </a>

                    <a href="/html/catequistas.html"
                       class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>
                        Voltar
                    </a>

                </div>

            </div>

            <!-- CONSULTA -->

            <section class="card">

                <div class="card-body">

                    <h2 class="card-title-cs mb-4">
                        <i class="bi bi-search me-2"></i>
                        Pesquisar Catequistas
                    </h2>

                    <!-- FILTROS -->

                    <div class="row g-3 align-items-end mb-4">

                        <div class="col-md-3">

                            <label for="tipoBusca"
                                   class="form-label">
                                Pesquisar por
                            </label>

                            <select
                                id="tipoBusca"
                                class="form-select">
                                <option value="nome">Nome</option>
                                <option value="cpf">CPF</option>
                            </select>

                        </div>

                        <div class="col-md-5">

                            <label for="valorBusca"
                                   class="form-label">
                                Pesquisa
                            </label>

                            <input
                                type="text"
                                id="valorBusca"
                                class="form-control"
                                placeholder="Digite o nome">

                        </div>

                        <div class="col-md-2">

                            <button
                                type="button"
                                id="btnPesquisar"
                                class="btn btn-primary w-100">

                                <i class="bi bi-search me-1"></i>
                                Pesquisar

                            </button>

                        </div>

                        <div class="col-md-2">

                            <button
                                type="button"
                                id="btnListar"
                                class="btn btn-outline-secondary w-100">

                                <i class="bi bi-list-ul me-1"></i>
                                Listar Todos

                            </button>

                        </div>

                    </div>

                    <!-- MENSAGENS -->

                    <div
                        id="mensagem"
                        role="status"
                        aria-live="polite">
                    </div>

                    <!-- TABELA -->

                    <div class="table-responsive">

                        <table class="table align-middle">

                            <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>E-mail</th>
                                <th>Data início</th>
                                <th>Data término</th>
                                <th>Ações</th>
                            </tr>
                            </thead>

                            <tbody id="tabelaCatequistas">

                            <tr>
                                <td colspan="7"
                                    class="text-center text-muted py-4">
                                    Carregando catequistas...
                                </td>
                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </div>

        <!-- RODAPE -->

        <footer class="app-footer">
            CateSys · Gerenciamento Catequético
        </footer>

        <div
            id="sidebarOverlay"
            class="sidebar-overlay">
        </div>

    </main>

</div>

</body>
</html>
