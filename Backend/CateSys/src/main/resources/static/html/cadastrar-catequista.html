
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CateSys | Cadastrar Catequista</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/catequistas-paginas.css">

    <script src="/js/menu.js" defer></script>
    <script src="/js/catequistas.js" defer></script>
</head>

<body data-pagina="cadastro">

<div class="app-shell">

    <!-- MENU LATERAL -->

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-area">

        <!-- CABECALHO -->

        <header class="topbar">

            <button
                type="button"
                class="btn-menu"
                id="menuToggle"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="sidebar">
                <i class="bi bi-list"></i>
            </button>

            <div class="breadcrumb-area">

                <a href="/html/dashboard.html"
                   class="text-decoration-none">
                    CateSys
                </a>

                <i class="bi bi-chevron-right"></i>

                <a href="/html/catequistas.html"
                   class="text-decoration-none">
                    Catequistas
                </a>

                <i class="bi bi-chevron-right"></i>

                <strong id="caminhoAtual">
                    Cadastrar Catequista
                </strong>

            </div>

            <div class="d-flex align-items-center gap-3">
                <span class="today-date"></span>
                <div class="top-avatar">CS</div>
            </div>

        </header>

        <!-- CONTEUDO -->

        <div class="page-content">

            <div class="page-heading">

                <div>
                    <h1>Cadastrar Catequista</h1>

                    <p>
                        Preencha os dados para cadastrar
                        um catequista no sistema.
                    </p>
                </div>

                <a href="/html/catequistas.html"
                   class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Voltar
                </a>

            </div>

            <!-- FORMULARIO -->

            <section class="card">

                <div class="card-body">

                    <h2 class="card-title-cs mb-4"
                        id="tituloFormulario">
                        <i class="bi bi-person-plus me-2"></i>
                        Cadastrar Catequista
                    </h2>

                    <form id="formCatequista" novalidate>

                        <input
                            type="hidden"
                            id="catequistaId">

                        <div class="row g-3">

                            <!-- NOME -->

                            <div class="col-md-6 campo">

                                <label for="nome"
                                       class="form-label">
                                    Nome completo *
                                </label>

                                <input
                                    type="text"
                                    id="nome"
                                    class="form-control"
                                    maxlength="150"
                                    placeholder="Nome completo"
                                    required>

                            </div>

                            <!-- CPF -->

                            <div class="col-md-6 campo">

                                <label for="cpf"
                                       class="form-label">
                                    CPF *
                                </label>

                                <input
                                    type="text"
                                    id="cpf"
                                    class="form-control"
                                    maxlength="14"
                                    inputmode="numeric"
                                    placeholder="000.000.000-00"
                                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                                    required>

                            </div>

                            <!-- TELEFONE -->

                            <div class="col-md-6 campo">

                                <label for="telefone"
                                       class="form-label">
                                    Telefone
                                </label>

                                <input
                                    type="tel"
                                    id="telefone"
                                    class="form-control"
                                    maxlength="15"
                                    inputmode="numeric"
                                    placeholder="(00) 00000-0000">

                            </div>

                            <!-- EMAIL -->

                            <div class="col-md-6 campo">

                                <label for="email"
                                       class="form-label">
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    maxlength="150"
                                    placeholder="email@exemplo.com">

                            </div>

                            <!-- DATA INICIO -->

                            <div class="col-md-6 campo">

                                <label for="dataInicio"
                                       class="form-label">
                                    Data de início
                                </label>

                                <input
                                    type="date"
                                    id="dataInicio"
                                    class="form-control">

                            </div>

                            <!-- DATA TERMINO -->

                            <div class="col-md-6 campo">

                                <label for="dataFim"
                                       class="form-label">
                                    Data de término
                                </label>

                                <input
                                    type="date"
                                    id="dataFim"
                                    class="form-control">

                            </div>

                            <!-- SECRETARIA -->

                            <div class="col-md-6 campo">

                                <label for="secretariaId"
                                       class="form-label">
                                    ID da Secretaria
                                </label>

                                <input
                                    type="number"
                                    id="secretariaId"
                                    class="form-control"
                                    min="1"
                                    step="1"
                                    placeholder="Opcional">

                            </div>

                        </div>

                        <!-- BOTOES -->

                        <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">

                            <button
                                type="button"
                                id="btnLimpar"
                                class="btn btn-outline-secondary">
                                <i class="bi bi-eraser me-1"></i>
                                Limpar
                            </button>

                            <button
                                type="submit"
                                id="btnSalvar"
                                class="btn btn-primary">
                                Cadastrar
                            </button>

                        </div>

                    </form>

                    <!-- MENSAGENS -->

                    <div
                        id="mensagem"
                        role="status"
                        aria-live="polite"
                        class="mt-3">
                    </div>

                </div>

            </section>

        </div>

        <!-- RODAPE -->

        <footer class="app-footer">
            CateSys · Gerenciamento Catequético
        </footer>

        <div
            id="sidebarOverlay"
            class="sidebar-overlay">
        </div>

    </main>

</div>

</body>
</html>
