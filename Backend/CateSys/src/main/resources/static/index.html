<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CateSys | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<!-- TELA DE LOGIN (sem menu lateral). Demonstrativa: o botão "Entrar" ainda não confere usuário nem senha. -->
<section class="login-screen">
    <div class="login-brand"><div class="text-center">
        <div class="brand-symbol"><i class="bi bi-book-half"></i><span class="brand-cross">+</span></div>
        <div class="brand-name">Cate<span>Sys</span></div>
        <p class="brand-tagline">Sistema de Gerenciamento Catequético</p>
    </div></div>
    <div class="login-panel">
        <form class="login-card">
            <h1>LOGIN</h1><p class="login-subtitle">Acesse sua área de trabalho</p>
            <label class="form-label" for="loginUser">CPF ou e-mail</label>
            <input class="form-control login-input" id="loginUser" name="loginUser" autocomplete="username" placeholder="Digite seu CPF ou e-mail">
            <label class="form-label mt-3" for="loginPassword">Senha</label>
            <input class="form-control login-input" id="loginPassword" name="loginPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha">
            <div class="mt-3"><a href="#" class="small-link">Esqueci a senha</a></div>
            <!-- LÓGICA FUTURA: validar o usuário e a senha no servidor antes de entrar.
                 Quando o painel do grupo (dashboard.html) entrar no projeto, troque o inicio.html abaixo por dashboard.html. -->
            <a href="inicio.html" class="btn btn-primary w-100 login-submit mt-4">Entrar</a>
            <div id="mensagem" class="alert d-none" role="alert"></div>
            <p class="text-center text-muted small mt-3 mb-0">Versão demonstrativa: qualquer dado entra.</p>
        </form>
    </div>
</section>

<script>
    // Ao abrir o sistema, confere se a parametrização já foi feita.
    // Se não foi (404), abre a tela de parametrização automaticamente.
    fetch('/api/parametrizacao')
        .then(resp => {
            if (resp.status === 404) {
                window.location.replace('parametrizacao.html');   // replace: o botão Voltar do navegador não cai de novo aqui
            }
        })
        .catch(() => {
            const aviso = document.getElementById('mensagem');
            aviso.textContent = 'Não foi possível falar com o servidor.';
            aviso.className = 'alert alert-danger mt-3 mb-0';
        });
</script>
</body>
</html>
