<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CateSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5 text-center" style="max-width: 520px;">
    <p class="text-secondary">Página temporária de teste (o login ainda não existe).</p>

    <div id="mensagem" class="alert d-none" role="alert"></div>

    <!-- Botão de teste: leva para a parametrização. Será trocado pelo login/menu depois. -->
    <a href="parametrizacao.html" class="btn btn-primary">Ir para Parametrização (teste)</a>
</div>

<script src="js/cabecalho.js" data-logo="grande"></script>
<script>
    // A cada acesso, confere se a parametrização já foi feita.
    // Se não foi (404), abre a tela de parametrização automaticamente.
    fetch('/api/parametrizacao')
        .then(resp => {
            if (resp.status === 404) {
                window.location.href = 'parametrizacao.html';
            }
        })
        .catch(() => {
            const area = document.getElementById('mensagem');
            area.textContent = 'Não foi possível falar com o servidor.';
            area.className = 'alert alert-danger';
        });
</script>
</body>
</html>
