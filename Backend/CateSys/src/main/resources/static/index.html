<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CateSys</title>
</head>
<body>
<a href="/html/index.html">Entrar no CateSys</a>
<script>
    // A cada acesso: sem parametrização (404), abre a tela de parametrização; senão, vai para o login.
    fetch('/api/parametrizacao')
        .then(resp => window.location.replace(resp.status === 404 ? '/html/parametrizacao.html' : '/html/index.html'))
        .catch(() => window.location.replace('/html/index.html'));
</script>
</body>
</html>
