<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CateSys - Parametrização</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 id="titulo" class="h3 text-primary mb-0">Parametrização</h1>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">Voltar</a>
    </div>

    <!-- Área de notificação (no lugar do alert()) -->
    <div id="mensagem" class="alert d-none" role="alert"></div>

    <form id="formParametrizacao" class="card card-body shadow-sm" novalidate autocomplete="off">

        <h2 class="h6 text-secondary">Identificação</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                <input type="text" id="nome" class="form-control" maxlength="100" required>
                <div class="invalid-feedback" id="erro-nome"></div>
            </div>
            <div class="col-md-4">
                <label for="cnpj" class="form-label">CNPJ <span class="text-danger">*</span></label>
                <input type="text" id="cnpj" class="form-control" maxlength="18" placeholder="00.000.000/0000-00" inputmode="numeric" required>
                <div class="invalid-feedback" id="erro-cnpj"></div>
            </div>
            <div class="col-md-8">
                <label for="responsavel" class="form-label">Responsável <span class="text-danger">*</span></label>
                <input type="text" id="responsavel" class="form-control" maxlength="100" required>
                <div class="invalid-feedback" id="erro-responsavel"></div>
            </div>
            <div class="col-md-4" id="grupoData">
                <label for="dataCriacao" class="form-label">Cadastrada em</label>
                <input type="text" id="dataCriacao" class="form-control" readonly>
            </div>
        </div>

        <h2 class="h6 text-secondary">Contato</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" id="telefone" class="form-control" maxlength="15" placeholder="(00) 00000-0000" inputmode="numeric">
                <div class="invalid-feedback" id="erro-telefone"></div>
            </div>
            <div class="col-md-4">
                <label for="email" class="form-label">E-mail</label>
                <input type="text" id="email" class="form-control" maxlength="100" placeholder="contato@exemplo.com">
                <div class="invalid-feedback" id="erro-email"></div>
            </div>
            <div class="col-md-4">
                <label for="site" class="form-label">Site</label>
                <input type="text" id="site" class="form-control" maxlength="100">
                <div class="invalid-feedback" id="erro-site"></div>
            </div>
        </div>

        <h2 class="h6 text-secondary">Endereço</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <label for="endereco" class="form-label">Endereço</label>
                <input type="text" id="endereco" class="form-control" maxlength="100">
                <div class="invalid-feedback" id="erro-endereco"></div>
            </div>
            <div class="col-md-4">
                <label for="bairro" class="form-label">Bairro</label>
                <input type="text" id="bairro" class="form-control" maxlength="80">
                <div class="invalid-feedback" id="erro-bairro"></div>
            </div>
            <div class="col-md-5">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="text" id="cidade" class="form-control" maxlength="80">
                <div class="invalid-feedback" id="erro-cidade"></div>
            </div>
            <div class="col-md-3">
                <label for="uf" class="form-label">UF</label>
                <input type="text" id="uf" class="form-control" maxlength="2" placeholder="SP">
                <div class="invalid-feedback" id="erro-uf"></div>
            </div>
            <div class="col-md-4">
                <label for="cep" class="form-label">CEP</label>
                <input type="text" id="cep" class="form-control" maxlength="9" placeholder="00000-000" inputmode="numeric">
                <div class="invalid-feedback" id="erro-cep"></div>
            </div>
        </div>

        <h2 class="h6 text-secondary">Logotipos (endereço da imagem)</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label for="logotipoGrande" class="form-label">Logotipo grande</label>
                <input type="text" id="logotipoGrande" class="form-control" maxlength="100">
                <div class="invalid-feedback" id="erro-logotipoGrande"></div>
            </div>
            <div class="col-md-6">
                <label for="logotipoPequeno" class="form-label">Logotipo pequeno</label>
                <input type="text" id="logotipoPequeno" class="form-control" maxlength="100">
                <div class="invalid-feedback" id="erro-logotipoPequeno"></div>
            </div>
        </div>

        <button type="submit" id="btnSalvar" class="btn btn-primary w-100">Salvar</button>
    </form>
</div>

<script src="js/cabecalho.js"></script>
<script src="js/parametrizacao.js"></script>
</body>
</html>
