<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CateSys | Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<!-- TELA DE CADASTRO (sem menu lateral). Mesmo layout da tela de login. -->
<section class="login-screen">
  <div class="login-brand"><div class="text-center">
    <img src="imgs/logo-login.png" alt="ícone do CateSys" id="logo-login">
    <p class="brand-tagline">Sistema de Gerenciamento Catequético</p>
  </div></div>
  <div class="login-panel">
    <form class="login-card" id="registroForm" novalidate>
      <h1>CADASTRO</h1><p class="login-subtitle">Crie seu acesso ao sistema</p>

      <div id="registroAlerta" class="alert notice d-none" role="alert"></div>

      <label class="form-label" for="regNome">Nome completo</label>
      <input class="form-control login-input" id="regNome" name="nome" autocomplete="name" placeholder="Digite seu nome" required>

      <label class="form-label mt-3" for="regCpf">CPF</label>
      <input class="form-control login-input" id="regCpf" name="cpf" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="000.000.000-00" required>

      <label class="form-label mt-3" for="regEmail">E-mail</label>
      <input class="form-control login-input" id="regEmail" name="email" type="email" autocomplete="email" placeholder="Digite seu e-mail" required>

      <label class="form-label mt-3" for="regSenha">Senha</label>
      <input class="form-control login-input" id="regSenha" name="senha" type="password" autocomplete="new-password" minlength="6" placeholder="Mínimo de 6 caracteres" required>

      <label class="form-label mt-3" for="regConfirma">Confirmar senha</label>
      <input class="form-control login-input" id="regConfirma" name="confirma" type="password" autocomplete="new-password" placeholder="Repita a senha" required>

      <button type="submit" class="btn btn-primary w-100 login-submit mt-4" id="registroBtn">Cadastrar</button>
      <p class="text-center text-muted small mt-3 mb-0">Já tem conta? <a href="index.html" class="small-link">Entrar</a></p>
    </form>
  </div>
</section>
<script src="js/registro.js"></script>
</body>
</html>
