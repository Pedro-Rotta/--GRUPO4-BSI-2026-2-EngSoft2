<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CateSys | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <section class="login-screen">
    <div class="login-brand">
      <div class="text-center">
        <img src="imgs/logo-login.png" alt="ícone do CateSys" id="logo-login">
        <p class="brand-tagline">Sistema de Gerenciamento Catequético</p>
      </div>
    </div>
    <div class="login-panel">
      <form class="login-card" id="loginForm" novalidate>
        <h1>LOGIN</h1>
        <p class="login-subtitle">Acesse sua área de trabalho</p>
        <div id="loginAlerta" class="alert notice d-none" role="alert"></div>
        <label class="form-label" for="loginUser">E-mail</label>
        <input class="form-control login-input" id="loginUser" name="email" autocomplete="username"
          placeholder="Digite seu e-mail" required>
        <label class="form-label mt-3" for="loginPassword">Senha</label>
        <input class="form-control login-input" id="loginPassword" name="senha" type="password" autocomplete="username"
          placeholder="Digite sua senha" required>
        <div class="mt-3"><a href="#" class="small-link">Esqueci a senha</a></div>
        <button type="submit" class="btn btn-primary w-100 login-submit mt-4" id="loginBtn">Entrar</button>
        <p class="text-center text-muted small mt-3 mb-0">Versão demonstrativa: qualquer dado entra.</p>
        <p class="text-center text-muted small mt-2 mb-0">Não tem conta? <a href="registro.html"
            class="small-link">Cadastre-se</a></p>
      </form>
    </div>
  </section>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
